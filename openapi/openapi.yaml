openapi: 3.1.0
info:
  title: Pdf Rendering Service
  version: 1.0.0
servers:
  - url: http://{{prs_base_url}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /:
    post:
      tags:
        - General
      summary: create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                notification_channels:
                  - azure_service_bus
                  - websocket
                tasks:
                  - - basePdf: storage/qa-testing/individualize/base_template.pdf
                      schema: storage/qa-testing/individualize/schema.json
                      input: storage/qa-testing/individualize/input.json
                    - basePdf: storage/qa-testing/individualize/base_template.pdf
                      schema: storage/qa-testing/individualize/schema.json
                      input: storage/qa-testing/individualize/input.json
                other_output_options:
                  - svg
                  - png
                  - jpg
                  - webp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /{queue_id}:
    get:
      tags:
        - General
      summary: details
      parameters:
        - name: queue_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
